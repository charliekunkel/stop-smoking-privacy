<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy Policy — Stop Smoking</title>
<meta name="description" content="Privacy policy for the Stop Smoking Android app. Everything stays on your device: no account, no server, no analytics.">
<!-- Reviewers and crawlers must both be able to read this. -->
<meta name="robots" content="index, follow">
<style>
  :root {
    --ink: #1a1c19;
    --muted: #5b625a;
    --rule: #dfe4dd;
    --accent: #2e7d32;
    --bg: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 46rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  h1 {
    font-size: 2rem; line-height: 1.2; margin: 0 0 .25rem;
    letter-spacing: -0.02em;
  }
  h2 {
    font-size: 1.15rem; margin: 2.5rem 0 .6rem; padding-left: .7rem;
    border-left: 4px solid var(--accent); line-height: 1.3;
  }
  p, li { color: var(--ink); }
